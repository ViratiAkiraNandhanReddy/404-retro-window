<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404-retro-window</title>

  <meta name="description"
    content="A clean retro-style 404 error page inspired by system windows. Built using pure HTML, CSS, and JavaScript with interactive color controls.">
  <meta name="keywords"
    content="404 page, error page, custom 404, retro 404 page, html css javascript 404, github pages 404, minimal 404 design, Virati Akiranandhan Reddy, VIRATI AKIRANANDHAN REDDY, viratiakiranandhanreddy, ViratiAkiraNandhanReddy">

  <meta name="robots" content="index, follow">

  <!-- Open Graph -->

  <meta property="og:title" content="Retro Window 404 Page">
  <meta property="og:description"
    content="Minimal retro styled 404 error page with interactive color controls. Built using pure HTML, CSS, and JavaScript.">
  <meta property="og:type" content="website">

  <!-- Twitter Preview -->

  <meta name="twitter:title" content="Retro Window 404 Page">
  <meta name="twitter:description" content="Minimal retro styled 404 error page with interactive color controls.">

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

</head>

<body>

  <div class="window-wrapper">
    <div class="title-bar">
      <div class="controls">
        <button class="color-dot red" title="Red" onclick="changeColor('#ff5f56')"></button>
        <button class="color-dot yellow" title="Yellow" onclick="changeColor('#ffbd2e')"></button>
        <button class="color-dot green" title="Green" onclick="changeColor('#27c93f')"></button>
      </div>
      <span class="error-label">SYSTEM ERROR</span>
    </div>

    <div class="content">
      <div class="main-text">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="8" y1="9" x2="8.01" y2="9"></line>
          <line x1="16" y1="9" x2="16.01" y2="9"></line>
          <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
        </svg>
        <h1>404</h1>
      </div>
      <div class="sub-text">The page you are looking for has vanished.</div>

      <a href="/" class="home-btn">GO HOME</a>
    </div>
  </div>

  <script src="js/script.js"></script>

</body>

</html>
